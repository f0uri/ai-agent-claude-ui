version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
