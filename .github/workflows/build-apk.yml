name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'

      - name: 📥 Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: 🔨 Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'http://localhost:3001/api' }}

      - name: 📱 Add Capacitor Android platform
        working-directory: frontend
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔨 Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon -x lintVitalRelease

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🔨 Build Release APK (unsigned)
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -x lintVitalRelease
        continue-on-error: true

      - name: 📤 Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
